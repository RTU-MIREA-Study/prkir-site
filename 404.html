<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>СР1 | Анимации</title>
<link href="logo.svg" rel="icon" type="image/svg+xml"/>
<link href="style.css" rel="stylesheet"/>
<style>
        .sr1-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .sr1-card { background: var(--panel); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
        .sr1-card h3 { margin-bottom: 20px; font-size: 1.1rem; }
        
        /* 1. Часы */
        .clock { width: 80px; height: 80px; border: 3px solid var(--accent); border-radius: 50%; position: relative; margin: 0 auto; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: var(--text); border-radius: 2px; }
        .hour { width: 4px; height: 20px; margin-left: -2px; animation: spin 12s linear infinite; }
        .minute { width: 2px; height: 30px; margin-left: -1px; animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* 2. Солнечная система */
        .solar { width: 80px; height: 80px; border-radius: 50%; position: relative; margin: 0 auto; }
        .sun { width: 20px; height: 20px; background: var(--accent); border-radius: 50%; position: absolute; top: 30px; left: 30px; }
        .orbit { width: 70px; height: 70px; border: 1px solid rgba(166,124,91,.3); border-radius: 50%; position: absolute; top: 5px; left: 5px; animation: spin 3s linear infinite; }
        .planet { width: 10px; height: 10px; background: var(--text); border-radius: 50%; position: absolute; top: 0; left: 30px; }
        
        /* 3. Панорама */
        .panorama { width: 100%; height: 80px; overflow: hidden; position: relative; }
        .panorama-track { display: flex; width: 200%; animation: slide 8s linear infinite; }
        .panorama-track img { width: 50%; height: 80px; object-fit: cover; }
        @keyframes slide { 100% { transform: translateX(-50%); } }
        
        /* 4. Произвольная фигура */
        .morph { width: 80px; height: 80px; background: var(--accent); margin: 0 auto; animation: morphAnim 4s ease-in-out infinite; }
        @keyframes morphAnim { 0%, 100% { border-radius: 50%; } 50% { border-radius: 0; transform: rotate(45deg); } }
        
        /* 5. Падающий шарик (CSS) */
        .ball-container { width: 80px; height: 80px; position: relative; margin: 0 auto; overflow: hidden; }
        .ball { width: 20px; height: 20px; background: var(--accent); border-radius: 50%; position: absolute; left: 30px; animation: bounceBall 1s ease-in-out infinite alternate; }
        @keyframes bounceBall { from { top: 0; } to { top: 60px; } }
        
        /* 6. Прямоугольник (ИСПРАВЛЕНО) */
        .rect-anim { width: 20px; height: 60px; background: var(--accent); margin: 0 auto; animation: rotateRect 3s linear infinite; }
        @keyframes rotateRect { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
